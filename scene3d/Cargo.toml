[package]
name = "ellua-scene3d"
version = "0.1.0"
edition = "2021"

[lib]
name = "ellua_scene3d"
crate-type = ["cdylib", "rlib"]

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
gltf = { version = "1.4", default-features = false, features = ["import", "utils"] }
pollster = "0.4"
wgpu = "24"
